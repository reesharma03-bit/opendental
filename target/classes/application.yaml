opendental:
  base-url: ${OPENDENTAL_BASE_URL:http://localhost:30223/api/v1}
  # Open Dental rejects every request that has no Authorization header with
  # 400 "Malformed API request.". Expected format:
  #   ODFHIR <DeveloperKey>/<CustomerKey>
  # Leave empty only when the target Open Dental instance does not require a key.
  api-key: ${OPENDENTAL_API_KEY:}
  clinics:
    default-clinic-code: ${DEFAULT_CLINIC_CODE:CLINIC_A}

spring:
  application:
    name: open-dental-api

  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres}
    username: ${SUPABASE_DB_USERNAME:postgres.qpjofnaucxsskamuepkh}
    password: ${SUPABASE_DB_PASSWORD:Postgres6623}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SupabaseHikariPool
      auto-commit: false
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000
      data-source-properties:
        prepareThreshold: 0
        ApplicationName: open-dental-api

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        connection:
          provider_disables_autocommit: true
        hbm2ddl:
          auto: ${JPA_DDL_AUTO:none}

  flyway:
    enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
  default-produces-media-type: application/json

reconciliation:
  enabled: ${RECONCILIATION_ENABLED:true}
  cron: ${RECONCILIATION_CRON:0 * * * * *}

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

management:
  endpoints:
    web:
      exposure:
        include: health,info
      # Actuator endpoints are served by their own handler mapping, so the web app's
      # /actuator/health call (the connection indicator) needs a CORS entry here.
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000}
        allowed-methods: GET,OPTIONS
        allowed-headers: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    defaults:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.clinic.opendental: ${LOG_LEVEL_APP:INFO}
    com.zaxxer.hikari: ${LOG_LEVEL_HIKARI:WARN}
    org.springframework.boot.context.config: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        hbm2ddl:
          auto: validate

logging:
  level:
    com.clinic.opendental: DEBUG
    org.hibernate.SQL: DEBUG
---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        hbm2ddl:
          auto: validate

logging:
  level:
    com.clinic.opendental: INFO

  hikari:
    maximum-pool-size: 20
    minimum-idle: 5
---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres}
    username: ${SUPABASE_DB_USERNAME:postgres.qpjofnaucxsskamuepkh}
    password: ${SUPABASE_DB_PASSWORD:Postgres6623}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-test-query: SELECT 1

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          auto: validate

logging:
  level:
    com.clinic.opendental: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
