opendental:
  # Used only when a clinic row has no base_url of its own.
  base-url: ${OPENDENTAL_BASE_URL:http://localhost:30223/api/v1}
  # Open Dental rejects every request that has no Authorization header with
  # 400 "Malformed API request.". Expected format:
  #   ODFHIR <DeveloperKey>/<CustomerKey>
  # Used when a clinic row has no api_key of its own.
  api-key: ${OPENDENTAL_API_KEY:}
  # Open Dental allows 1 request per second per API key, or 1 per 5 seconds when the key
  # only has read access (ApiReadAll): set 5000 for such keys. Shared by every call.
  min-request-interval-ms: ${OPENDENTAL_MIN_REQUEST_INTERVAL_MS:1000}

spring:
  # Background jobs (dashboard changes to Open Dental, change pulls, scheduled syncs) each
  # get a thread, so a long sync never delays pushing a dashboard change.
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:4}

  # The REST API speaks snake_case and leaves out empty fields.
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres}
    username: ${SUPABASE_DB_USERNAME:postgres.qpjofnaucxsskamuepkh}
    password: ${SUPABASE_DB_PASSWORD:Postgres6623}
    hikari:
      # Writes run in explicit transactions (TransactionTemplate / @Transactional).
      auto-commit: false
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 20000
      data-source-properties:
        # Supabase's transaction pooler (port 6543) can't keep server-side prepared statements.
        prepareThreshold: 0
        # Send batched inserts as multi-row statements (the sync writes in batches).
        reWriteBatchedInserts: true
        # Shows this app's connections by name in Supabase.
        ApplicationName: open-dental-api

  jpa:
    # The schema is managed by the supabase-*.sql scripts; set JPA_DDL_AUTO=validate to check it.
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    open-in-view: false
    properties:
      hibernate:
        # Matches auto-commit: false above.
        connection:
          provider_disables_autocommit: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Every minute: patients, appointments and procedure logs changed in Open Dental since the last pull.
reconciliation:
  enabled: ${RECONCILIATION_ENABLED:true}
  cron: ${RECONCILIATION_CRON:0 * * * * *}

# Dashboard sign-in. Sessions end after session-minutes without activity (HIPAA
# automatic log-off). Set AUTH_JWT_SECRET (32+ random characters) so sessions survive
# restarts, and AUTH_COOKIE_SECURE=true when the dashboard is served over HTTPS.
# The first Admin is created from the bootstrap settings when there are no users yet.
auth:
  jwt-secret: ${AUTH_JWT_SECRET:}
  session-minutes: ${AUTH_SESSION_MINUTES:30}
  cookie-secure: ${AUTH_COOKIE_SECURE:false}
  max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
  lockout-minutes: ${AUTH_LOCKOUT_MINUTES:15}
  bootstrap-admin-email: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-admin-password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
  bootstrap-admin-name: ${AUTH_BOOTSTRAP_ADMIN_NAME:Practice Admin}

# AI Assistant (dashboard). Uses a model served by Groq (OpenAI-compatible chat
# completions with tool calling); leave the key empty to switch the assistant off.
# Only send patient data to the API under a signed BAA with the provider.
assistant:
  api-key: ${GROQ_API_KEY:}
  model: ${ASSISTANT_MODEL:openai/gpt-oss-120b}
  base-url: ${ASSISTANT_BASE_URL:https://api.groq.com/openai/v1}

# Copies Open Dental resources without their own table into od_resource_records.
resource-sync:
  enabled: ${RESOURCE_SYNC_ENABLED:true}
  # Every tick, resources that are due are pulled: changes only where Open Dental can
  # filter by DateTStamp (every 2 min / 15 min / daily by tier), else a full re-read.
  tick-ms: ${RESOURCE_SYNC_TICK_MS:60000}
  # Everything, including resources fetched per patient (same as the Force Sync button).
  full-cron: ${RESOURCE_SYNC_FULL_CRON:0 0 2 * * *}

# Changes are saved in Supabase first and then pushed to Open Dental. When the
# immediate push fails they stay in od_sync_queue and are retried with backoff.
od-sync:
  enabled: ${OD_SYNC_ENABLED:true}
  interval-ms: ${OD_SYNC_INTERVAL_MS:30000}
  max-attempts: ${OD_SYNC_MAX_ATTEMPTS:50}

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

# Only /actuator/health (status only, no details) for deployment health checks.
management:
  endpoints:
    web:
      exposure:
        include: health
