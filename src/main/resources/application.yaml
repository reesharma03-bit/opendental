opendental:
  base-url: ${OPENDENTAL_BASE_URL:http://localhost:30223/api/v1}
  # Open Dental rejects every request that has no Authorization header with
  # 400 "Malformed API request.". Expected format:
  #   ODFHIR <DeveloperKey>/<CustomerKey>
  # Leave empty only when the target Open Dental instance does not require a key.
  api-key: ${OPENDENTAL_API_KEY:}
  clinics:
    default-clinic-code: ${DEFAULT_CLINIC_CODE:CLINIC_A}

spring:
  application:
    name: open-dental-api

  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres}
    username: ${SUPABASE_DB_USERNAME:postgres.qpjofnaucxsskamuepkh}
    password: ${SUPABASE_DB_PASSWORD:Postgres6623}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SupabaseHikariPool
      auto-commit: false
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000
      data-source-properties:
        prepareThreshold: 0
        ApplicationName: open-dental-api

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        connection:
          provider_disables_autocommit: true
        hbm2ddl:
          auto: ${JPA_DDL_AUTO:none}

  flyway:
    enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
  default-produces-media-type: application/json

reconciliation:
  enabled: ${RECONCILIATION_ENABLED:true}
  cron: ${RECONCILIATION_CRON:0 * * * * *}

# Dashboard sign-in. Sessions end after session-minutes without activity (HIPAA
# automatic log-off). Set AUTH_JWT_SECRET (32+ random characters) so sessions survive
# restarts, and AUTH_COOKIE_SECURE=true when the dashboard is served over HTTPS.
# The first Admin is created from the bootstrap settings when there are no users yet.
auth:
  jwt-secret: ${AUTH_JWT_SECRET:}
  session-minutes: ${AUTH_SESSION_MINUTES:30}
  cookie-secure: ${AUTH_COOKIE_SECURE:false}
  max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
  lockout-minutes: ${AUTH_LOCKOUT_MINUTES:15}
  bootstrap-admin-email: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-admin-password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
  bootstrap-admin-name: ${AUTH_BOOTSTRAP_ADMIN_NAME:Practice Admin}

# AI Assistant (dashboard). Uses Claude through the Anthropic API; leave the key empty to
# switch the assistant off. Only send patient data to the API under a signed BAA.
assistant:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ASSISTANT_MODEL:claude-opus-5-5}

# Copies Open Dental resources without their own table into od_resource_records.
# cron: resources Open Dental lists in one paged call.
# full-cron: everything, including resources fetched per patient / per parent
#            (same as the Force Sync button).
resource-sync:
  enabled: ${RESOURCE_SYNC_ENABLED:true}
  cron: ${RESOURCE_SYNC_CRON:0 */15 * * * *}
  full-cron: ${RESOURCE_SYNC_FULL_CRON:0 0 2 * * *}
  request-delay-ms: ${RESOURCE_SYNC_REQUEST_DELAY_MS:0}

# Changes are saved in Supabase first and then pushed to Open Dental. When the
# immediate push fails they stay in od_sync_queue and are retried with backoff.
od-sync:
  enabled: ${OD_SYNC_ENABLED:true}
  interval-ms: ${OD_SYNC_INTERVAL_MS:30000}
  max-attempts: ${OD_SYNC_MAX_ATTEMPTS:50}

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

management:
  endpoints:
    web:
      exposure:
        include: health,info
      # Actuator endpoints are served by their own handler mapping, so the web app's
      # /actuator/health call (the connection indicator) needs a CORS entry here.
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000}
        allowed-methods: GET,OPTIONS
        allowed-headers: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    defaults:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.clinic.opendental: ${LOG_LEVEL_APP:INFO}
    com.zaxxer.hikari: ${LOG_LEVEL_HIKARI:WARN}
    org.springframework.boot.context.config: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        hbm2ddl:
          auto: validate

logging:
  level:
    com.clinic.opendental: DEBUG
    org.hibernate.SQL: DEBUG
---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        hbm2ddl:
          auto: validate

logging:
  level:
    com.clinic.opendental: INFO

  hikari:
    maximum-pool-size: 20
    minimum-idle: 5
---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres}
    username: ${SUPABASE_DB_USERNAME:postgres.qpjofnaucxsskamuepkh}
    password: ${SUPABASE_DB_PASSWORD:Postgres6623}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-test-query: SELECT 1

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          auto: validate

logging:
  level:
    com.clinic.opendental: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
